<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23c63f2a%22/%3E%3Ctext x=%2232%22 y=%2247%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23fff%22%3E%E5%AD%A6%3C/text%3E%3C/svg%3E"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Тетрадь репетитора HSK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;600;700&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: тетрадь 作业本 в клетку. Каждый уровень HSK — свой цвет туши (青 蓝 紫 红), кисть 毛笔 для печатей и крупных иероглифов, красные пометки учителя только для оценок. */
:root{
  --paper:#edf1eb; --paper-grid:rgba(31,96,68,.055); --sheet:#fcfdfb; --sheet2:#f5f8f4;
  --ink:#19231e; --ink2:#4d5d55; --ink3:#7d8b84; --line:#d7e1d9; --grid:#a8ccb7; --grid2:#e1ece5;
  --red:#c63f2a; --red-bg:#fbe7e2; --gold:#a3700f; --gold-bg:#fbf0d9;
  --l1:#1d7650; --l1-bg:#ddefe4; --l2:#1b6a90; --l2-bg:#dcebf4; --l3:#6650b4; --l3-bg:#ebe6f8; --l4:#c13f2b; --l4-bg:#f9e4de;
  --lv:var(--l1); --lv-bg:var(--l1-bg);
  --zh:"Noto Serif SC","Songti SC","SimSun",serif; --brush:"Ma Shan Zheng","KaiTi","STKaiti",serif;
  --py:"Noto Sans","Segoe UI",Arial,sans-serif; --ui:"Onest","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 28px rgba(20,40,30,.07); --lift:0 2px 4px rgba(20,40,30,.07),0 14px 34px rgba(20,40,30,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1310; --paper-grid:rgba(120,200,160,.045); --sheet:#141c18; --sheet2:#18221d;
  --ink:#e3ebe5; --ink2:#a1b2a8; --ink3:#71847a; --line:#25332b; --grid:#2e5a44; --grid2:#1d3127;
  --red:#ff7a61; --red-bg:#3a1d17; --gold:#e3b45c; --gold-bg:#3a2e14;
  --l1:#5cc092; --l1-bg:#173022; --l2:#5fb4de; --l2-bg:#13293a; --l3:#a995f2; --l3-bg:#251f3e; --l4:#ff7a61; --l4-bg:#3a1d17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25); --lift:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1310; --paper-grid:rgba(120,200,160,.045); --sheet:#141c18; --sheet2:#18221d;
  --ink:#e3ebe5; --ink2:#a1b2a8; --ink3:#71847a; --line:#25332b; --grid:#2e5a44; --grid2:#1d3127;
  --red:#ff7a61; --red-bg:#3a1d17; --gold:#e3b45c; --gold-bg:#3a2e14;
  --l1:#5cc092; --l1-bg:#173022; --l2:#5fb4de; --l2-bg:#13293a; --l3:#a995f2; --l3-bg:#251f3e; --l4:#ff7a61; --l4-bg:#3a1d17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25); --lift:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.35); color-scheme:dark}
body[data-lv="2"],.lv2{--lv:var(--l2);--lv-bg:var(--l2-bg)} body[data-lv="3"],.lv3{--lv:var(--l3);--lv-bg:var(--l3-bg)} body[data-lv="4"],.lv4{--lv:var(--l4);--lv-bg:var(--l4-bg)} .lv1{--lv:var(--l1);--lv-bg:var(--l1-bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{background-color:var(--paper);background-image:linear-gradient(var(--paper-grid) 1px,transparent 1px),linear-gradient(90deg,var(--paper-grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--ui);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
body.present{font-size:1.2rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lv);outline-offset:2px;border-radius:6px}
a{color:var(--lv)}
.zh{font-family:var(--zh)} .brush{font-family:var(--brush);font-weight:400}
.py{font-family:var(--py);color:var(--ink2)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.no-py .py-t:not(.shown),body.no-ru .ru-t:not(.shown){color:transparent!important;background:repeating-linear-gradient(90deg,var(--grid2) 0 6px,transparent 6px 9px);border-radius:4px;cursor:pointer;user-select:none}
body.no-py .py-t:not(.shown) *,body.no-ru .ru-t:not(.shown) *{visibility:hidden}
body:not(.is-owner) .owner-only{display:none!important}
@media (prefers-reduced-motion:no-preference){.main.enter>*{animation:rise .35s ease both}@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:10px 14px;min-height:60px;flex-wrap:wrap;padding-block:8px;max-width:1380px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.seal{width:36px;height:36px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--brush);font-size:26px;line-height:1;transform:rotate(-5deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.brand b{font-weight:800;font-size:1.06rem;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{display:block;color:var(--ink3);font-size:.74rem;line-height:1.2}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:9px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.nav a:hover{background:var(--grid2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--lv-bg);color:var(--lv)}
.nav .badge{background:var(--red);color:#fff;border-radius:999px;font-size:.7rem;padding:0 6px;line-height:1.5}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px;font-size:.84rem;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--grid)}
.chip[aria-pressed="true"]{background:var(--lv-bg);border-color:transparent;color:var(--lv);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45}
.chip[aria-pressed="true"] .dot{opacity:1}
.acct{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);text-decoration:none;color:var(--ink);font-size:.86rem;max-width:240px}
.acct b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--lv-bg);color:var(--lv);white-space:nowrap}
.role.t{background:var(--red-bg);color:var(--red)}
.ava{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--grid2);display:inline-grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--ink2);overflow:hidden}
.ava.lg{width:56px;height:56px;font-size:1.3rem}

/* layout */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px}
body.present .wrap,body.noside .wrap{grid-template-columns:minmax(0,1fr)}
body.present .side,body.noside .side{display:none}
body.noside .wrap{max-width:1180px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sheet);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:12px}
.levels button{border:0;background:transparent;border-radius:10px;padding:7px 0 5px;color:var(--ink2);font-weight:700;line-height:1.1;display:grid;justify-items:center;gap:2px}
.levels button .brush{font-size:1.25rem;color:var(--lv)}
.levels button small{font-weight:500;font-size:.66rem;color:var(--ink3)}
.levels button[aria-pressed="true"]{background:var(--lv);color:var(--sheet)}
.levels button[aria-pressed="true"] .brush,.levels button[aria-pressed="true"] small{color:var(--sheet)}
.book{font-size:.8rem;color:var(--ink3);margin:0 6px 8px;display:flex;justify-content:space-between;gap:8px}
.lessons{list-style:none;margin:0;padding:6px;display:grid;gap:2px;background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.lessons a{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.lessons a:hover{background:var(--grid2)}
.lessons a[aria-current="page"]{background:var(--lv-bg)}
.lessons .num{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink3);font-size:.85rem;padding-top:3px;text-align:right}
.lessons a[aria-current="page"] .num{color:var(--lv)}
.lessons .zh{display:block;font-size:1.02rem;line-height:1.35}
.lessons small{display:block;color:var(--ink3);font-size:.77rem;line-height:1.3;margin-top:1px}
.lessons .done{width:8px;height:8px;border-radius:50%;background:var(--lv);margin-top:8px}
.lessons .part{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:10px 10px 2px;font-weight:700}
.mobile-pick{display:none}

/* sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0;position:relative}
.sheet-pad{padding:28px 32px}
.stack{display:grid;gap:18px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .sep{width:4px;height:4px;border-radius:50%;background:var(--grid)}
.lesson-head{display:grid;gap:10px;padding:30px 32px 22px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.lesson-head::after{content:"";position:absolute;inset:0 0 auto auto;width:240px;height:100%;background:radial-gradient(circle at 80% 30%,var(--lv-bg),transparent 65%);pointer-events:none;opacity:.9}
.lesson-head>*{position:relative;z-index:1}
.sealnum{position:absolute;right:28px;top:26px;z-index:2;font-family:var(--brush);color:var(--red);border:3px solid var(--red);border-radius:8px;padding:4px 8px 2px;font-size:30px;line-height:1;writing-mode:vertical-rl;transform:rotate(6deg);opacity:.9;background:var(--sheet)}
.cells{display:flex;flex-wrap:wrap;margin:6px 0 2px;padding-right:70px}
.cell{width:62px;height:62px;display:grid;place-items:center;font-family:var(--zh);font-size:40px;font-weight:600;color:var(--ink);border:1.5px solid var(--grid);margin-left:-1.5px;margin-top:-1.5px;
  background:linear-gradient(to right,transparent calc(50% - .5px),var(--grid2) calc(50% - .5px),var(--grid2) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to bottom,transparent calc(50% - .5px),var(--grid2) calc(50% - .5px),var(--grid2) calc(50% + .5px),transparent calc(50% + .5px)),var(--sheet)}
.cell.p{font-size:30px;color:var(--ink3)}
body.present .cell{width:78px;height:78px;font-size:52px}
.head-py{font-family:var(--py);font-size:1.15rem;color:var(--ink2)}
.head-ru{font-size:1.4rem;font-weight:700;letter-spacing:-.01em}
.head-d{color:var(--ink2);max-width:70ch;margin:0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{border-color:var(--grid);background:var(--grid2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--lv);border-color:var(--lv);color:var(--sheet)}
.btn.pri:hover{filter:brightness(1.07);background:var(--lv);box-shadow:var(--shadow)}
.btn.red{color:var(--red);border-color:var(--red-bg);background:var(--red-bg)}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs a,.tabs button{padding:13px 12px 11px;text-decoration:none;color:var(--ink2);font-weight:700;font-size:.94rem;border:0;background:none;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs a:hover,.tabs button:hover{color:var(--ink)}
.tabs [aria-current="page"],.tabs [aria-selected="true"]{color:var(--lv);border-bottom-color:var(--lv)}
.tabs span{font-weight:500;color:var(--ink3);font-size:.8rem;margin-left:4px;font-variant-numeric:tabular-nums}
.pane{padding:24px 32px 32px}
.pane-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pane-bar .grow{margin-right:auto;color:var(--ink2);font-size:.92rem}
.extra{margin:0 32px;padding:14px 16px;border-radius:12px;background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);display:grid;gap:6px}
.extra b{color:var(--gold);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.extra p{margin:0;white-space:pre-wrap}
.extra.mine{background:var(--sheet2);border-color:var(--line)}
.extra.mine b{color:var(--ink3)}
#lx{display:grid;gap:10px;padding-top:18px}
#lx:empty{display:none}

/* words */
.words{width:100%;border-collapse:collapse}
.words th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line)}
.words td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.words tr:last-child td{border-bottom:0}
.words tbody tr:hover{background:var(--sheet2)}
.w-zh{font-family:var(--zh);font-size:1.7rem;line-height:1.2;white-space:nowrap}
.w-zh button{border:0;background:none;padding:2px 4px;border-radius:6px;font:inherit}
.w-zh button:hover{background:var(--lv-bg);color:var(--lv)}
.w-py{font-family:var(--py);font-size:1.02rem;color:var(--ink2);white-space:nowrap}
.w-pos{color:var(--ink3);font-size:.8rem;white-space:nowrap}
.w-act{white-space:nowrap;text-align:right}
.ic{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);display:inline-grid;place-items:center;color:var(--ink2);padding:0;text-decoration:none;flex:none}
.ic:hover{color:var(--lv);border-color:var(--grid)}
.ic svg{width:16px;height:16px}
.ic.on{color:var(--lv);background:var(--lv-bg);border-color:transparent}

/* grammar */
.gram{display:grid;gap:18px}
.g{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--sheet)}
.g-h{display:flex;gap:14px;align-items:center;padding:16px 20px 0}
.g-n{font-weight:800;color:var(--sheet);background:var(--lv);font-variant-numeric:tabular-nums;font-size:.85rem;flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.g-h h3{font-size:1.15rem;font-weight:700}
.g-f{margin:12px 20px 0;padding:10px 14px;border-radius:10px;background:var(--lv-bg);color:var(--ink);font-weight:600;font-size:1.02rem;overflow-x:auto;white-space:nowrap}
.g-f .zh{font-size:1.18em}
.g-d{padding:12px 20px 0;max-width:78ch}
.g-d p{margin:0 0 8px}
.g-ex{list-style:none;margin:12px 0 0;padding:4px 0;border-top:1px dashed var(--line);background:var(--sheet2)}
.g-ex li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:9px 20px}
.g-ex li+li{border-top:1px dashed var(--line)}
.ex-zh{font-family:var(--zh);font-size:1.3rem;line-height:1.45}
.ex-py{font-family:var(--py);color:var(--ink2);font-size:.95rem}
.ex-ru{color:var(--ink2);font-size:.95rem}

/* practice */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ex-card{border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;background:var(--sheet);display:grid;gap:6px;align-content:start;transition:transform .15s,box-shadow .15s,border-color .15s}
.ex-card:hover{border-color:var(--lv);transform:translateY(-2px);box-shadow:var(--lift)}
.ex-card b{font-size:1.02rem}
.ex-card small{color:var(--ink2);font-size:.86rem;line-height:1.4}
.ex-card .k{font-family:var(--brush);font-size:2rem;color:var(--lv);line-height:1}
.ex-card .cnt{font-size:.78rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.ex-card .best{font-size:.78rem;font-weight:700;color:var(--lv)}
.runner{max-width:760px;margin:0 auto}
.run-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar{flex:1;height:7px;border-radius:9px;background:var(--grid2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lv);border-radius:9px;transition:width .3s}
.run-cnt{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:.85rem}
.q{font-size:1.08rem;margin-bottom:6px;color:var(--ink2)}
.q-big{font-family:var(--zh);font-size:2.7rem;line-height:1.3;margin:6px 0 4px}
.q-sent{font-family:var(--zh);font-size:1.6rem;line-height:1.6;margin:6px 0}
.blank{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--ink3);text-align:center;margin:0 .15em;color:var(--lv)}
.q-hint{color:var(--ink3);font-size:.95rem;margin-bottom:14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.opt{border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);padding:12px 14px;text-align:left;font-size:1.05rem;min-height:54px;transition:transform .1s}
.opt:hover:not([disabled]){border-color:var(--lv);background:var(--lv-bg)}
.opt.zhopt{font-family:var(--zh);font-size:1.35rem}
.opt.pyopt{font-family:var(--py)}
.opt.ok{border-color:var(--l1);background:var(--l1-bg);color:var(--l1);font-weight:600}
.opt.bad{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.opt[disabled]{cursor:default}
.fb{min-height:28px;margin-top:14px;font-weight:600}
.fb.ok{color:var(--l1)} .fb.bad{color:var(--red)}
.run-nav{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap;align-items:center}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:10px;border-radius:12px;border:1.5px dashed var(--grid);margin:10px 0}
.tokens.src{border-style:solid;border-color:var(--line);background:var(--sheet2)}
.tok{font-family:var(--zh);font-size:1.3rem;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);box-shadow:0 2px 0 var(--line)}
.tok:hover{border-color:var(--lv)}
.tok.used{visibility:hidden}
.answer{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--lv-bg)}
.card-fc{border:1.5px solid var(--grid);border-radius:20px;min-height:300px;display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer;background:var(--sheet);user-select:none;box-shadow:var(--shadow)}
